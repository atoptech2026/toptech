body{margin:0;min-width:320px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--fb)}
a{color:inherit;text-decoration:none}.hidden{display:none!important}

${s.address?`<div class="ad"><svg class="ic"><use href="#i-pin"/></svg><span>${esc(s.address)}</span></div>`:''}
${s.notes?`<p class="nt">${esc(s.notes)}</p>`:''}
${s.address?`<a class="mp" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+' '+s.address)}" target="_blank" rel="noopener">عرض على الخريطة <svg class="ic"><use href="#i-ext"/></svg></a>`:''}
</div></article>`).join('');
}
async function loadStores(){
  showSkeleton();
  const stores=await supabase('stores','?is_active=eq.true&order=sort_order.asc,name.asc');
  $('loading').classList.add('hidden');
  if(!stores.length){$('empty').classList.remove('hidden');return}
  renderStores(stores);
}
$('footer-year').textContent=new Date().getFullYear();
loadStores();
</script>
